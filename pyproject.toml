[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "claude-token-reducer"
version = "1.4.0"
description = "Open-source local-first context compression and token reduction pipeline for Claude Code with hybrid retrieval (BM25 + vectors), reranking, and AST-aware chunking."
keywords = [
    "claude-code",
    "token-reduction",
    "context-compression",
    "hybrid-retrieval",
    "bm25",
    "tree-sitter",
    "embeddings",
    "rag",
    "local-first",
    "open-source",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "hnswlib>=0.8.0",
    "faiss-cpu>=1.8.0",
]
ast = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
]
full = ["token-reducer[ml,ast]"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyright>=1.1",
]

[project.scripts]
token-reducer = "token_reducer.cli:main"

[tool.maturin]
module-name = "token_reducer_core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — ruff format handles this
    "SIM108", # ternary operator — often less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter_*", "sentence_transformers", "hnswlib", "faiss"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
